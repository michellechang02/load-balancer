name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: make
      - name: Run smoke test
        run: |
          if [ -x ./lb_sim ]; then
            printf "2\n1\n" | ./lb_sim >/dev/null || true
          else
            echo "lb_sim not built"
          fi
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck || true
      - name: Run cppcheck
        run: |
          cppcheck --version || true
          cppcheck --enable=warning,performance,portability --std=c++17 include src || true
      - name: Run tests
        run: |
          make test
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-14 || true
      - name: Run clang-tidy (best-effort)
        run: |
          if command -v clang-tidy-14 >/dev/null 2>&1; then
            clang-tidy-14 src/*.cpp include/*.h -- -std=c++17 -Iinclude || true
          else
            echo "clang-tidy not available"
          fi
